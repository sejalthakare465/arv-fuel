{% extends 'core/home.html' %} 

{% block content %}
<div class="max-w-md mx-auto bg-white/90 dark:bg-slate-800/90 p-8 sketch-border mt-10 shadow-2xl relative transition-all">
    
    <!-- Washi / Scotch Tape effect at the top -->
    <div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-amber-100/60 dark:bg-slate-600/40 w-28 h-8 -rotate-2 border border-amber-300/40 dark:border-slate-500/30 shadow-sm backdrop-blur-xs pointer-events-none"></div>

    <h2 class="text-4xl handwritten text-center mb-1 text-orange-700 dark:text-orange-400 font-bold">
        Join the Journal 📝
    </h2>
    <p class="handwritten text-center text-orange-600 dark:text-orange-300 text-lg mb-6 italic">
        "Write it down to ease it!"
    </p>
    
    <form method="POST" class="space-y-4" action="{% url 'register' %}">
        {% csrf_token %}
        
        <!-- Role Selector Card -->
        <div class="flex flex-col mb-4 p-3 bg-orange-50/60 dark:bg-slate-700/50 sketch-border-dashed">
            <label class="handwritten text-xl mb-2 text-gray-800 dark:text-gray-200 font-bold">I am joining as a...</label>
            <div class="flex justify-around">
                <label class="handwritten text-lg flex items-center gap-2 cursor-pointer text-gray-800 dark:text-gray-200">
                    <input type="radio" name="role" value="patient" checked onchange="updateBtn(this.value)" class="accent-orange-500"> Patient 🌱
                </label>
                <label class="handwritten text-lg flex items-center gap-2 cursor-pointer text-gray-800 dark:text-gray-200">
                    <input type="radio" name="role" value="doctor" onchange="updateBtn(this.value)" class="accent-blue-500"> Doctor 🩺
                </label>
            </div>
        </div>

        <!-- Dynamic Form Fields -->
        {% for field in form %}
            {% if field.name != 'role' %} 
                <div class="flex flex-col">
                    <label class="handwritten text-xl text-gray-800 dark:text-gray-200">{{ field.label }}</label>
                    <div class="sketch-border p-1 bg-transparent">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-red-500 dark:text-red-400 text-xs mt-1 handwritten">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endif %}
        {% endfor %}

        <!-- Interactive Button -->
        <button type="submit" id="reg-btn" class="w-full sketch-border bg-orange-200 dark:bg-orange-600 text-orange-950 dark:text-white p-4 handwritten text-2xl mt-6 hover:bg-orange-300 dark:hover:bg-orange-500 transition-all active:translate-y-1 font-bold">
            Start My Journey →
        </button>
    </form>
</div>

<script>
    // Changes button text and color dynamically based on role selection
    function updateBtn(role) {
        const btn = document.getElementById('reg-btn');
        if(role === 'doctor') {
            btn.innerText = "Open My Clinic 🩺 →";
            btn.className = "w-full sketch-border bg-blue-200 dark:bg-blue-600 text-blue-950 dark:text-white p-4 handwritten text-2xl mt-6 hover:bg-blue-300 dark:hover:bg-blue-500 transition-all active:translate-y-1 font-bold";
        } else {
            btn.innerText = "Start My Journey 🚀 →";
            btn.className = "w-full sketch-border bg-orange-200 dark:bg-orange-600 text-orange-950 dark:text-white p-4 handwritten text-2xl mt-6 hover:bg-orange-300 dark:hover:bg-orange-500 transition-all active:translate-y-1 font-bold";
        }
    }
</script>

<style>
    /* Cleanly styling Django forms inside organic sketch inputs */
    input:not([type="radio"]), select, textarea {
        background: transparent !important;
        border: none !important;
        outline: none !important;
        font-family: 'Indie Flower', 'Architects Daughter', cursive;
        width: 100%;
        padding: 4px;
        font-size: 1.15rem;
    }
    .dark input:not([type="radio"]), .dark select, .dark textarea {
        color: #f8fafc !important;
    }
    .sketch-border-dashed {
        border: 2px dashed #444;
        border-radius: 8px 3px 10px 5px;
    }
    .dark .sketch-border-dashed {
        border-color: #94a3b8;
    }
</style>
{% endblock %}
