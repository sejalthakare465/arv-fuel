{% extends 'core/home.html' %}

{% block content %}
<div class="max-w-lg mx-auto mt-10 p-8 bg-white/90 dark:bg-slate-800 sketch-border shadow-2xl">
    <h2 class="text-4xl handwritten text-orange-800 dark:text-orange-300 text-center mb-2">First Step</h2>
    <p class="text-center italic mb-6 dark:text-gray-300">"Let's get to know your health baseline."</p>
    
    <form method="post" class="space-y-6">
        {% csrf_token %}
        {% for field in form %}
            <div class="flex flex-col">
                <label class="handwritten text-xl dark:text-white">{{ field.label }}</label>
                <div class="mt-1">
                    {{ field }}
                </div>
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-orange-400 text-white font-bold py-3 sketch-border hover:bg-orange-500 dark:hover:bg-orange-600 transition-all">
            Save My Profile
        </button>
    </form>
</div>

<style>
    /* Styling the Django inputs to look hand-drawn and work with Dark Mode */
    input, textarea {
        width: 100%;
        padding: 10px;
        background: transparent !important;
        border: 2px solid #333 !important;
        border-radius: 10px 5px 12px 4px !important;
        color: #333;
    }
    .dark input, .dark textarea {
        border-color: #fb923c !important; /* orange-400 */
        color: white !important;
    }
</style>
{% endblock %}
